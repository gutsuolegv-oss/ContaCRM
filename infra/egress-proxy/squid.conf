# Proxy de ieșire ContaCRM — permite DOAR tunelurile (CONNECT) spre destinațiile din listă albă.
# Orice altă cerere este refuzată și înregistrată în jurnal.

http_port 3128

# --- Listă albă ---
acl telegram_api dstdomain api.telegram.org
# Înlocuiește cu serverul SMTP real (ex. smtp.gmail.com, mail.birou.md):
acl smtp_relay   dstdomain smtp.example.md

acl https_port port 443
acl smtp_ports port 587 465
acl CONNECT method CONNECT

# Doar clienții din rețeaua „egress” (adică notify-gateway)
acl gateway_net src 172.28.2.0/24

http_access deny !gateway_net
http_access allow CONNECT telegram_api https_port
http_access allow CONNECT smtp_relay smtp_ports
http_access deny all

# Fără cache: nu păstrăm nimic pe disc
cache deny all

# Jurnal la stdout (docker logs egress-proxy)
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
logfile_rotate 0

# Nu dezvăluim informații despre proxy
via off
forwarded_for delete
httpd_suppress_version_string on
