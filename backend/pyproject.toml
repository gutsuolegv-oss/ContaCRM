[project]
name = "contacrm-backend"
version = "0.1.0"
description = "ContaCRM — API backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "argon2-cffi>=23.1,<26.0",
    "pyjwt>=2.9,<3.0",
    "httpx>=0.27,<1.0",  # botul Telegram (Bot API)
    "cryptography>=43",  # criptarea tokenului botului în bază (Fernet)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # assert în teste

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # ENVIRONMENT se setează înaintea importurilor din app
"migrations/versions/*" = ["E501"]  # SQL generat (CHECK-uri) pe un singur rând

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
